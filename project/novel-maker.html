(function() {
  const e = window.onerror;
  window.onerror = function(m) {
    if (typeof m === 'string' && m.includes('ResizeObserver')) return true;
    return e ? e.apply(this, arguments) : false;
  };
  window.addEventListener('error', function(ev) {
    if (ev && ev.message && ev.message.includes('ResizeObserver')) { ev.stopImmediatePropagation(); ev.preventDefault(); }
  }, true);
})();
</script>

<script type="text/babel">
const __TWK = `
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.92);color:#29261b;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
.twk-x:hover{background:rgba(0,0,0,.06)}
.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.twk-row{display:flex;flex-direction:column;gap:5px}
.twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
.twk-lbl>span:first-child{font-weight:500}
.twk-val{color:rgba(41,38,27,.5)}
.twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
.twk-sect:first-child{padding-top:0}
.twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;border-radius:999px;background:rgba(0,0,0,.12);outline:none}
.twk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
.twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
.twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
.twk-seg.dragging .twk-seg-thumb{transition:none}
.twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;height:22px;border-radius:6px;cursor:default;padding:0}
.twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
.twk-toggle[data-on="1"]{background:#34c759}
.twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues(prev => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}
function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const posRef = React.useRef({ x:16, y:16 });
  React.useEffect(() => {
    const onMsg = e => {
      const t = e && e.data && e.data.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = e => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const move = ev => { posRef.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; panel.style.right = posRef.current.x+'px'; panel.style.bottom = posRef.current.y+'px'; };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <React.Fragment>
      <style>{__TWK}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: posRef.current.x, bottom: posRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>&#10005;</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </React.Fragment>
  );
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, value, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakSlider({ label, value, min=0, max=100, step=1, unit='', onChange }) {
  return (
    <TweakRow label={label} value={value + unit}>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))}/>
    </TweakRow>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i/></button>
    </div>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  const valRef = React.useRef(value); valRef.current = value;
  const segAt = x => { const r = trackRef.current.getBoundingClientRect(); const i = Math.floor(((x-r.left-2)/(r.width-4))*n); return opts[Math.max(0,Math.min(n-1,i))].value; };
  const onPointerDown = e => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valRef.current) onChange(v0);
    const move = ev => { const v = segAt(ev.clientX); if (v !== valRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} className={dragging ? 'twk-seg dragging' : 'twk-seg'} onPointerDown={onPointerDown}>
        <div className="twk-seg-thumb" style={{ left: 'calc(2px + ' + idx + ' * (100% - 4px) / ' + n + ')', width: 'calc((100% - 4px) / ' + n + ')' }}/>
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
</script>

// ── Markdown renderer ─────────────────────────────────────────────────────
function MarkdownView({ text, theme }) {
  if (!text) return null;
  const acc = theme.accent;

  const renderInline = (str) => {
    // Handle **bold** and *italic*
    const parts = str.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
    return parts.map((p, pi) => {
      if (p.startsWith('**') && p.endsWith('**')) return <strong key={pi} style={{ fontWeight:700 }}>{p.slice(2,-2)}</strong>;
      if (p.startsWith('*') && p.endsWith('*')) return <em key={pi}>{p.slice(1,-1)}</em>;
      return p;
    });
  };

  // Normalise line endings, then process
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

  const nodes = lines.map((rawLine, i) => {
    const line = rawLine.trimEnd(); // keep leading spaces for indented bullets

    // H2: ## or ##text (with or without space)
    const h2 = line.match(/^#{2}\s*(.*)/);
    if (h2) return (
      <div key={i} style={{ fontSize:13, fontWeight:700, color:acc, marginTop:14, marginBottom:5, paddingBottom:4, borderBottom:'1px solid '+acc+'44', letterSpacing:'0.02em' }}>
        {renderInline(h2[1])}
      </div>
    );

    // H3: ### or ###text
    const h3 = line.match(/^#{3}\s*(.*)/);
    if (h3) return (
      <div key={i} style={{ fontSize:12, fontWeight:700, color:acc+'cc', marginTop:10, marginBottom:3 }}>
        {renderInline(h3[1])}
      </div>
    );

    // H1: #
    const h1 = line.match(/^#{1}\s+(.*)/);
    if (h1) return (
      <div key={i} style={{ fontSize:14, fontWeight:700, color:acc, marginTop:14, marginBottom:5 }}>
        {renderInline(h1[1])}
      </div>
    );

    // Numbered list
    const numMatch = line.match(/^(\d+)[.)]\s+(.*)$/);
    if (numMatch) return (
      <div key={i} style={{ display:'flex', gap:8, marginBottom:5, alignItems:'flex-start' }}>
        <span style={{ minWidth:20, height:20, background:acc+'22', color:acc, borderRadius:4, fontSize:10, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, marginTop:1 }}>{numMatch[1]}</span>
        <span style={{ fontSize:13, lineHeight:1.7 }}>{renderInline(numMatch[2])}</span>
      </div>
    );

    // Bullet: -, *, •, ▪
    const bulletMatch = line.match(/^[\-\*•▪]\s+(.*)/);
    if (bulletMatch) return (
      <div key={i} style={{ display:'flex', gap:8, marginBottom:4, alignItems:'flex-start' }}>
        <span style={{ color:acc, fontWeight:700, fontSize:14, lineHeight:'20px', flexShrink:0 }}>·</span>
        <span style={{ fontSize:13, lineHeight:1.7 }}>{renderInline(bulletMatch[1])}</span>
      </div>
    );

    // Divider
    if (/^[-*_]{3,}$/.test(line.trim())) return <hr key={i} style={{ border:'none', borderTop:'1px solid '+acc+'33', margin:'10px 0' }}/>;

    // Empty
    if (line.trim() === '') return <div key={i} style={{ height:6 }}/>;

    // Bold-only line (acts as mini-heading)
    if (/^\*\*[^*]+\*\*[：:。]?$/.test(line.trim())) return (
      <div key={i} style={{ fontSize:12, fontWeight:700, color:acc+'cc', marginTop:8, marginBottom:2 }}>{renderInline(line.trim())}</div>
    );

    // Paragraph
    return <div key={i} style={{ fontSize:13, lineHeight:1.8, marginBottom:2 }}>{renderInline(line)}</div>;
  });

  return <div style={{ fontFamily:theme.font.body }}>{nodes}</div>;
}

  const [result, setResult] = React.useState('');
  const [error, setError] = React.useState('');

  const [speakerA, setSpeakerA] = React.useState(characters[0]?characters[0].name:'');
  const [speakerB, setSpeakerB] = React.useState(characters[1]?characters[1].name:'');
  const [copied, setCopied] = React.useState(false);
  const s = theme.panel;
  const activeChapter = chapters.find(c => c.id === activeChapterId);

  const buildPrompt = () => {
    const profiles = characters.map(c => '['+c.name+'] '+c.age+', '+c.role+', personality: '+c.personality+', speech: '+(c.speechStyle||'natural')).join('\n');
    if (mode==='dialogue') return '你是言情小說寫作助手。角色：\n'+profiles+'\n\n幫'+speakerA+'和'+speakerB+'寫一段對話（約150字），情境：'+(contextInput||'兩人相遇')+(selectedText?'\n當前場景：\n'+selectedText:'')+'\n\n對話溫柔有張力，帶點曖昧。直接輸出對話，不要說明。';
    if (mode==='character') return '你是小說人物分析師。角色：\n'+profiles+'\n\n深度分析「'+(contextInput||speakerA)+'」，用Markdown格式輸出以下四節：\n## 核心性格\n## 潛在弱點\n## 關係動態\n## 寫作建議\n'+(selectedText?'參考場景：'+selectedText:'')+'\n\n每節約50字，中文輸出。';
    return '你是小說編輯。角色：\n'+profiles+'\n\n用Markdown格式審查以下章節：\n## 性格一致性\n## 情節邏輯\n## 時間地點\n## 改進建議\n\n章節：\n'+(activeChapter&&activeChapter.content?activeChapter.content.slice(0,1500):selectedText||'（無內容）')+'\n\n中文，具體指出問題。';
  };

  const runAI = async () => {
    setLoading(true); setResult(''); setError('');

    catch(e) { setError(t.aiError); }

              <button onClick={() => onInsert(result)} style={{ flex:1, padding:'6px 8px', background:theme.accent+'ee', color:'#fff', border:'1px solid '+theme.accent, borderRadius:6, fontSize:11, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:4, justifyContent:'center' }}><IInsert/>{t.insertEditor}</button>
              <button onClick={handleCopy} style={{ padding:'6px 9px', background:'transparent', color:theme.accent, border:'1px solid '+theme.accent, borderRadius:6, fontSize:11, cursor:'pointer', display:'flex', alignItems:'center', gap:4 }}><ICopy/>{copied?t.copied:t.copy}</button>
              <button onClick={runAI} style={{ padding:'6px 9px', background:'transparent', color:theme.accent, border:'1px solid '+theme.accent, borderRadius:6, fontSize:11, cursor:'pointer', display:'flex', alignItems:'center' }}><IRegen/></button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Character Modal ───────────────────────────────────────────────────────
function CharacterModal({ theme, t, character, onClose, onSave }) {
  const initRole = t.roles[0] || '主角';
  const [form, setForm] = React.useState(character || { id:String(Date.now()), name:'', age:'', role:initRole, appearance:'', personality:'', speechStyle:'', background:'', relationships:'', color:CHAR_COLORS[0] });
  const s = theme.modal;
  const set = (k, v) => setForm(f => ({ ...f, [k]:v }));
  const inp = { width:'100%', padding:'7px 10px', background:s.inputBg, border:'1px solid '+s.border, borderRadius:6, fontSize:13, color:s.text, fontFamily:theme.font.body, outline:'none', boxSizing:'border-box', lineHeight:1.6 };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000, backdropFilter:'blur(3px)' }} onClick={e => e.target===e.currentTarget&&onClose()}>
      <div style={{ width:560, maxHeight:'88vh', background:s.bg, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', boxShadow:'0 24px 60px rgba(0,0,0,0.22)', fontFamily:theme.font.body, color:s.text }}>
        <div style={{ padding:'20px 24px 16px', borderBottom:'1px solid '+s.border, display:'flex', alignItems:'center', gap:14, background:s.headerBg }}>
          <div style={{ width:44, height:44, borderRadius:'50%', background:form.color+'33', border:'2px solid '+form.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, fontFamily:theme.font.heading, fontWeight:700, color:form.color, flexShrink:0 }}>{form.name?form.name[0]:'?'}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, color:s.textMuted }}>{t.charProfile}</div>
            <div style={{ fontSize:18, fontFamily:theme.font.heading, fontWeight:700 }}>{form.name||t.newChar}</div>
          </div>
          <div style={{ display:'flex', gap:5 }}>{CHAR_COLORS.map(c => <button key={c} onClick={() => set('color',c)} style={{ width:18, height:18, borderRadius:'50%', background:c, border:form.color===c?'2px solid '+s.text:'2px solid transparent', cursor:'pointer', padding:0 }}/>)}</div>
        </div>
        <div style={{ flex:1, overflow:'auto', padding:'20px 24px' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
            {[['name','input'],['age','input'],['role','select'],['speechStyle','input']].map(([key, type]) => (
              <div key={key}>
                <div style={{ fontSize:11, marginBottom:5, fontWeight:600 }}>{t.fields[key]}</div>
                {type==='select'
                  ? <select value={form[key]} onChange={e => set(key,e.target.value)} style={inp}>{t.roles.map(r => <option key={r} value={r}>{r}</option>)}</select>
                  : <input value={form[key]} onChange={e => set(key,e.target.value)} placeholder={t.placeholders[key]} style={inp}/>
                }
              </div>
            ))}
          </div>
          {['appearance','personality','background','relationships'].map(key => (
            <div key={key} style={{ marginTop:14 }}>
              <div style={{ fontSize:11, marginBottom:5, fontWeight:600 }}>{t.fields[key]}</div>
              <textarea value={form[key]} onChange={e => set(key,e.target.value)} placeholder={t.placeholders[key]} style={{ ...inp, minHeight:60, resize:'vertical' }}/>
            </div>
          ))}
        </div>
        <div style={{ padding:'14px 24px', borderTop:'1px solid '+s.border, display:'flex', justifyContent:'flex-end', gap:10, background:s.headerBg }}>
          <button onClick={onClose} style={{ padding:'8px 20px', background:'transparent', border:'1px solid '+s.border, borderRadius:7, cursor:'pointer', fontSize:13, color:s.textMuted, fontFamily:theme.font.body }}>{t.cancel}</button>
          <button onClick={() => { onSave(form); onClose(); }} style={{ padding:'8px 24px', background:theme.accent, color:'#fff', border:'none', borderRadius:7, cursor:'pointer', fontSize:13, fontWeight:700, fontFamily:theme.font.body }}>{t.saveChar}</button>
        </div>
      </div>
    </div>
  );
}

// ── Progress Panel ────────────────────────────────────────────────────────
function ProgressPanel({ theme, t, chapters, onClose }) {
  const s = theme.modal;
  const totalWords = chapters.reduce((sum, c) => sum + (c.wordCount||0), 0);
  const target = 80000;
  const pct = Math.min(100, Math.round((totalWords/target)*100));
  const doneCount = chapters.filter(c => c.status===t.statusDone).length;
  const weekData = [420,680,550,890,1200,740,980];
  const maxW = Math.max.apply(null, weekData);

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000, backdropFilter:'blur(3px)' }} onClick={e => e.target===e.currentTarget&&onClose()}>
      <div style={{ width:520, background:s.bg, borderRadius:14, overflow:'hidden', boxShadow:'0 24px 60px rgba(0,0,0,0.22)', fontFamily:theme.font.body, color:s.text }}>
        <div style={{ padding:'18px 24px 14px', borderBottom:'1px solid '+s.border, display:'flex', justifyContent:'space-between', alignItems:'center', background:s.headerBg }}>
          <div style={{ fontSize:17, fontFamily:theme.font.heading, fontWeight:700 }}>{t.progressTitle}</div>
          <button onClick={onClose} style={{ background:'transparent', border:'none', cursor:'pointer', fontSize:18, color:s.textMuted, lineHeight:1 }}>&#215;</button>
        </div>
        <div style={{ padding:'22px 24px' }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:22 }}>
            {[[totalWords.toLocaleString(),t.wordUnit,t.totalWords],[doneCount+'/'+chapters.length,t.chapterUnit,t.chapComplete],[pct+'%','',t.completion]].map(([val,unit,label]) => (
              <div key={label} style={{ background:s.inputBg, borderRadius:10, padding:'14px', textAlign:'center', border:'1px solid '+s.border }}>
                <div style={{ fontSize:24, fontFamily:theme.font.heading, fontWeight:700, color:theme.accent }}>{val}<span style={{ fontSize:11, fontWeight:400, marginLeft:2 }}>{unit}</span></div>
                <div style={{ fontSize:11, color:s.textMuted, marginTop:3 }}>{label}</div>
              </div>
            ))}
          </div>
          <div style={{ marginBottom:20 }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, color:s.textMuted, marginBottom:5 }}><span>{t.overallProgress}</span><span>{t.target} {target.toLocaleString()} {t.wordUnit}</span></div>
            <div style={{ height:10, background:s.border, borderRadius:5 }}>
              <div style={{ height:'100%', width:pct+'%', background:'linear-gradient(90deg,'+theme.accent+'cc,'+theme.accent+')', borderRadius:5 }}/>
            </div>
            <div style={{ fontSize:11, color:s.textMuted, marginTop:4 }}>{t.wordsLeft.replace('{n}',(target-totalWords).toLocaleString())}</div>
          </div>
          <div style={{ marginBottom:20 }}>
            <div style={{ fontSize:12, color:s.textMuted, marginBottom:10 }}>{t.weeklyWords}</div>
            <div style={{ display:'flex', alignItems:'flex-end', gap:6, height:70 }}>
              {weekData.map((w,i) => (
                <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
                  <div style={{ width:'100%', height:Math.round((w/maxW)*60)+'px', background:i===6?theme.accent:theme.accent+'55', borderRadius:'3px 3px 0 0' }}/>
                  <span style={{ fontSize:10, color:s.textMuted }}>{t.weekDays[i]}</span>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div style={{ fontSize:12, color:s.textMuted, marginBottom:8 }}>{t.chapStatus}</div>
            {chapters.map((ch,i) => (
              <div key={ch.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'6px 10px', background:s.inputBg, borderRadius:6, border:'1px solid '+s.border, marginBottom:5 }}>
                <span style={{ fontSize:11, color:s.textMuted, minWidth:24 }}>Ch{i+1}</span>
                <span style={{ flex:1, fontSize:13 }}>{ch.title}</span>
                <span style={{ fontSize:11, color:s.textMuted }}>{(ch.wordCount||0).toLocaleString()} {t.wordUnit}</span>
                <span style={{ fontSize:10, padding:'2px 7px', borderRadius:4, background:(STATUS_COLORS[ch.status]||'#8B7355')+'20', color:STATUS_COLORS[ch.status]||'#8B7355' }}>{ch.status}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "parchment",
  "fontSize": 17,
  "lineHeight": 2,
  "showAI": true,
  "lang": "en"
}/*EDITMODE-END*/;

function TBtn({ label, onClick, theme, active }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ padding:'4px 11px', background:active?theme.accent+'22':hov?theme.sidebar.border+'88':'transparent', border:active?'1px solid '+theme.accent+'55':'1px solid transparent', borderRadius:6, cursor:'pointer', color:active?theme.accent:theme.sidebar.text, fontSize:12, fontFamily:theme.font.body, transition:'all 0.15s', whiteSpace:'nowrap' }}>
      {label}
    </button>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = THEMES[tweaks.variant] || THEMES.parchment;
  const t = React.useMemo(() => {
    const base = TRANSLATIONS[tweaks.lang] || TRANSLATIONS['zh-TW'];
    return Object.assign({}, base, { _lang: tweaks.lang || 'zh-TW' });
  }, [tweaks.lang]);

  const [chapters, setChapters] = React.useState(INIT_CHAPTERS);
  const [characters, setCharacters] = React.useState(INIT_CHARS);
  const [notes, setNotes] = React.useState('設定：現代台北\n時間軸：春末夏初\n\n伏筆：林沐川認識曉晴前男友？');
  const [activeChapterId, setActiveChapterId] = React.useState('1');
  const [aiOpen, setAiOpen] = React.useState(tweaks.showAI);
  const [selectedText, setSelectedText] = React.useState('');
  const [charModal, setCharModal] = React.useState(null);
  const [showProgress, setShowProgress] = React.useState(false);
  const [saved, setSaved] = React.useState(true);
  const [floatingMenu, setFloatingMenu] = React.useState(null);
  const editorRef = React.useRef(null);

  React.useEffect(() => { setAiOpen(tweaks.showAI); }, [tweaks.showAI]);

  const activeChapter = chapters.find(c => c.id === activeChapterId);

  const updateContent = (val) => {
    setSaved(false);
    setChapters(prev => prev.map(c => c.id===activeChapterId ? { ...c, content:val, wordCount:val.replace(/\s/g,'').length } : c));
    clearTimeout(window._st);
    window._st = setTimeout(() => setSaved(true), 1200);
  };

  const handleInsert = (text) => {
    const ta = editorRef.current; if (!ta) return;
    const ss = ta.selectionStart, ee = ta.selectionEnd;
    const cur = activeChapter ? activeChapter.content : '';
    updateContent(cur.slice(0,ss) + '\n\n' + text + '\n\n' + cur.slice(ee));
    setTimeout(() => { ta.selectionStart = ta.selectionEnd = ss + text.length + 4; ta.focus(); }, 50);
  };

  const handleSelect = () => {
    const ta = editorRef.current; if (!ta) return;
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    if (sel && sel.trim().length > 5) {
      setSelectedText(sel);
      const rect = ta.getBoundingClientRect();
      setFloatingMenu({ x:rect.left+60, y:rect.top+60 });
    } else { setFloatingMenu(null); if (!sel) setSelectedText(''); }
  };

  const addChapter = () => {
    const n = { id:String(Date.now()), title:'第 '+(chapters.length+1)+' 章', content:'', wordCount:0, status:t.statusDraft };
    setChapters(prev => [...prev, n]); setActiveChapterId(n.id);
  };

  const saveCharacter = (char) => {
    setCharacters(prev => {
      const idx = prev.findIndex(c => c.id===char.id);
      if (idx>=0) { const next=[...prev]; next[idx]=char; return next; }
      return [...prev, Object.assign({}, char, { color:CHAR_COLORS[prev.length%CHAR_COLORS.length] })];
    });
  };

  const wrapSel = (before, after) => {
    const ta = editorRef.current; if (!ta) return;
    const ss = ta.selectionStart, ee = ta.selectionEnd;
    const cur = activeChapter ? activeChapter.content : '';
    updateContent(cur.slice(0,ss) + before + cur.slice(ss,ee) + after + cur.slice(ee));
  };

  const ed = theme.editor;
  const isDark = tweaks.variant === 'midnight';
  const toggleTheme = () => setTweak('variant', isDark ? 'parchment' : 'midnight');
  const statusOpts = [t.statusDraft, t.statusWriting, t.statusDone];
  const editorPlaceholder = t.editorPlaceholder.replace('{title}', activeChapter ? activeChapter.title : '');

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:theme.app.bg, color:theme.app.text, transition:'background 0.3s,color 0.3s' }}>
      {/* Top bar */}
      <div style={{ height:44, display:'flex', alignItems:'center', padding:'0 16px', background:theme.sidebar.bg, borderBottom:'1px solid '+theme.sidebar.border, gap:8, flexShrink:0 }}>
        <div style={{ fontFamily:theme.font.heading, fontWeight:700, fontSize:15, letterSpacing:'0.02em' }}>&#10022; {t.appTitle}</div>
        <div style={{ flex:1 }}/>
        <select value={activeChapter?activeChapter.status:t.statusDraft} onChange={e => setChapters(prev => prev.map(c => c.id===activeChapterId?Object.assign({},c,{status:e.target.value}):c))}
          style={{ padding:'3px 8px', background:'transparent', border:'1px solid '+theme.sidebar.border, borderRadius:5, fontSize:12, color:theme.app.text, fontFamily:theme.font.body, cursor:'pointer' }}>
          {statusOpts.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={tweaks.lang||'zh-TW'} onChange={e => setTweak('lang', e.target.value)}
          style={{ padding:'3px 8px', background:'transparent', border:'1px solid '+theme.sidebar.border, borderRadius:5, fontSize:12, color:theme.app.text, fontFamily:theme.font.body, cursor:'pointer' }}>
          <option value="zh-TW">繁體</option>
          <option value="zh-CN">简体</option>
          <option value="en">EN</option>
        </select>
        <button onClick={toggleTheme} title={isDark?'Switch to warm':'切換深色'}
          style={{ width:32, height:28, display:'flex', alignItems:'center', justifyContent:'center', background:'transparent', border:'1px solid '+theme.sidebar.border, borderRadius:6, cursor:'pointer', color:theme.sidebar.text, fontSize:15, transition:'all 0.2s' }}
          onMouseEnter={e => e.currentTarget.style.background=theme.sidebar.border+'88'}
          onMouseLeave={e => e.currentTarget.style.background='transparent'}
        >{isDark ? '☀' : '◑'}</button>
        <TBtn label={t.progress} onClick={() => setShowProgress(true)} theme={theme}/>
        <TBtn label={t.addChar} onClick={() => setCharModal('new')} theme={theme}/>
        <TBtn label={aiOpen?t.aiOff:t.aiOn} onClick={() => setAiOpen(v=>!v)} theme={theme} active={aiOpen}/>
      </div>

      {/* Main */}
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        <NovelSidebar theme={theme} t={t} chapters={chapters} characters={characters} notes={notes} activeChapterId={activeChapterId} onSelectChapter={setActiveChapterId} onAddChapter={addChapter} onNotesChange={setNotes} onSelectCharacter={setCharModal}/>

        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:ed.bg, transition:'background 0.3s' }}>
          <div style={{ height:38, display:'flex', alignItems:'center', padding:'0 16px', gap:4, background:ed.toolbarBg, borderBottom:'1px solid '+ed.border, flexShrink:0 }}>
            <span style={{ fontSize:14, fontFamily:theme.font.heading, fontWeight:600, marginRight:8 }}>{activeChapter?activeChapter.title:''}</span>
            <div style={{ width:1, height:16, background:ed.border, margin:'0 6px' }}/>
            {[[t.bold,'**','**'],[t.italic,'_','_'],[t.quote,'\n「','」\n']].map(([l,b,a]) => (
              <button key={l} onClick={() => wrapSel(b,a)} style={{ padding:'3px 8px', background:'transparent', border:'none', borderRadius:4, cursor:'pointer', color:ed.textMuted, fontSize:11, fontFamily:theme.font.body }}
                onMouseEnter={e => e.currentTarget.style.background=ed.border+'66'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}
              >{l}</button>
            ))}
            <div style={{ flex:1 }}/>
            <span style={{ fontSize:11, color:ed.textMuted }}>{saved?t.saved:t.saving}</span>
          </div>
          <div style={{ flex:1, overflow:'auto', padding:'40px 0' }}>
            <textarea ref={editorRef} value={activeChapter?activeChapter.content:''} onChange={e => updateContent(e.target.value)}
              onSelect={handleSelect} onMouseUp={handleSelect} onKeyUp={handleSelect}
              placeholder={editorPlaceholder}
              style={{ display:'block', margin:'0 auto', width:'100%', maxWidth:680, minHeight:'calc(100vh - 180px)', background:'transparent', border:'none', outline:'none', resize:'none', fontSize:tweaks.fontSize, lineHeight:tweaks.lineHeight, color:ed.text, fontFamily:theme.font.body, padding:'0 24px', letterSpacing:'0.04em', transition:'color 0.3s' }}
            />
          </div>
          <div style={{ height:28, display:'flex', alignItems:'center', padding:'0 16px', gap:16, background:theme.statusBar.bg, borderTop:'1px solid '+ed.border, fontSize:11, color:theme.statusBar.text, flexShrink:0 }}>
            <span>{(activeChapter?activeChapter.wordCount:0).toLocaleString()} {t.wordUnit}</span>
            <span>{t.chapter} {chapters.findIndex(c=>c.id===activeChapterId)+1} {t.chapterOf} {chapters.length} {t.chapterUnit}</span>
          </div>
        </div>

        {aiOpen && <NovelAIPanel theme={theme} t={t} characters={characters} chapters={chapters} activeChapterId={activeChapterId} selectedText={selectedText} onInsert={handleInsert} onClose={() => setAiOpen(false)}/>}
      </div>

      {floatingMenu && selectedText && (
        <div style={{ position:'fixed', top:floatingMenu.y-44, left:floatingMenu.x, background:theme.sidebar.bg, border:'1px solid '+theme.sidebar.border, borderRadius:8, padding:'4px', display:'flex', gap:4, boxShadow:'0 4px 16px rgba(0,0,0,0.15)', zIndex:500 }}>
          <button onClick={() => { setAiOpen(true); setFloatingMenu(null); }} style={{ padding:'5px 12px', background:theme.accent, color:'#fff', border:'none', borderRadius:6, fontSize:11, cursor:'pointer', fontFamily:theme.font.body, fontWeight:600 }}>&#10022; {t.openAI}</button>
          <button onClick={() => setFloatingMenu(null)} style={{ padding:'5px 8px', background:'transparent', border:'none', borderRadius:6, fontSize:11, cursor:'pointer', color:theme.sidebar.textMuted }}>&#215;</button>
        </div>
      )}

      {charModal && <CharacterModal theme={theme} t={t} character={charModal==='new'?null:charModal} onClose={() => setCharModal(null)} onSave={saveCharacter}/>}
      {showProgress && <ProgressPanel theme={theme} t={t} chapters={chapters} onClose={() => setShowProgress(false)}/>}

      <TweaksPanel>
        <TweakSection label="視覺風格"/>
        <TweakRadio label="主題" value={tweaks.variant} options={[{value:'parchment',label:'書卷暖褐'},{value:'midnight',label:'墨夜深藍'},{value:'minimal',label:'清簡白紙'}]} onChange={v => setTweak('variant',v)}/>
        <TweakSection label="編輯器"/>
        <TweakSlider label="字體大小" value={tweaks.fontSize} min={13} max={24} step={1} unit="px" onChange={v => setTweak('fontSize',v)}/>
        <TweakSlider label="行距" value={tweaks.lineHeight} min={1.5} max={2.8} step={0.1} onChange={v => setTweak('lineHeight',v)}/>
        <TweakToggle label="預設開啟 AI 面板" value={tweaks.showAI} onChange={v => setTweak('showAI',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
